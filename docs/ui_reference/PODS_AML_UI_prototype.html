const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const EDGES=[[0,1,2,3],[0,2,3,1],[3,0,2,2],[4,0,5,1],[1,5,4,2],[2,6,6,1],[7,0,4,1],[3,8,7,1],[4,9,8,2],[5,10,9,1],[6,11,5,1],[7,12,10,2],[8,13,11,1],[9,14,12,1],[12,15,13,1],[1,2,6,1],[12,3,9,1],[5,6,10,1],[13,9,14,1]];

function lineChart(v){const W=560,H=210,p=34,max=Math.max(...v)*1.1,x=i=>p+i*(W-p-12)/(v.length-1),y=n=>H-26-n/max*(H-46);

return `<svg viewBox="0 0 ${W} ${H}" class="msvg" role="img" aria-label="Model alerts per day, demo data">${g}<polygon points="${p},${H-26} ${pts} ${x(v.length-1)},${H-26}" fill="#2563EB" fill-opacity=".1"/><polyline points="${pts}" fill="none" stroke="#2563EB" stroke-width="2.2"/>${v.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="3" fill="#2563EB"><title>Sep ${i+1}: ${n} alerts (demo)</title></circle>`).join('')}${v.map((n,i)=>i%2===0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mu)">Sep ${i+1}</text>`:'').join('')}</svg>`}
function donut(segs,center){const R=42,C=2*Math.PI*R;let off=0;return `<svg viewBox="0 0 120 120" width="150" height="150" role="img"><g transform="rotate(-90 60 60)" fill="none" stroke-width="16">${segs.map(s=>{const d=s[1]/100*C,el=`<circle cx="60" cy="60" r="${R}" stroke="${s[2]}" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-off}"><title>${s[0]} ${s[1]}% (demo)</title></circle>`;off+=d;return el}).join('')}</g><text x="60" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="var(--tx)">${center[0]}</text><text x="60" y="73" text-anchor="middle" font-size="9" fill="var(--mu)">${center[1]}</text></svg>`}
function hbars(items,color,fmt){const m=Math.max(...items.map(i=>i[1]));return items.map(i=>`<div class="bar"><span class="n">${i[0]}</span><span class="t"><i style="width:${i[1]/m*100}%;background:${i[2]||color}"></i></span><span class="vv">${fmt?fmt(i[1]):fmtN(i[1])}</span></div>`).join('')}
function nodeG(x,y,n,o={}){const a=ACC[n],r=o.r||20,c=RC[a.risk];return `<g class="gn" ${o.attr||`data-go="account:${n}"`} transform="translate(${x} ${y})"><title>${a.id} · ${a.risk} risk</title>${o.sel?`<circle r="${r+9}" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-width="2.5"/>`:''}<circle r="${r}" fill="${c}" fill-opacity=".16" stroke="${c}" stroke-width="2.5"/><text y="4" text-anchor="middle" font-size="10" font-weight="600" fill="${c}">${a.bank}</text><text y="${r+16}" text-anchor="middle" font-size="11" fill="var(--tx)">${a.id}</text></g>`}
function edgeL(p,q,rad,cnt,flow){const dx=q[0]-p[0],dy=q[1]-p[1],d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,x1=p[0]+ux*rad,y1=p[1]+uy*rad,x2=q[0]-ux*(rad+4),y2=q[1]-uy*(rad+4);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${flow?'#2563EB':'#94A3B8'}" stroke-width="${flow?2:1.4}" ${flow?'class="flow"':''} marker-end="url(#${flow?'arrb':'arr'})"/>${cnt>1?`<text x="${(x1+x2)/2}" y="${(y1+y2)/2-5}" text-anchor="middle" font-size="10" fill="var(--mu)">×${cnt}</text>`:''}`}
function ego(n){const nb=[],seen={};EDGES.forEach(e=>{if(e[0]===n&&!seen[e[1]]){seen[e[1]]=1;nb.push([e[1],'out',e[3]])}else if(e[1]===n&&!seen[e[0]]){seen[e[0]]=1;nb.push([e[0],'in',e[3]])}});
const c=[260,150],P=nb.map((m,i)=>{const a=(i/nb.length)*2*Math.PI-Math.PI/2;return [c[0]+200*Math.cos(a),c[1]+105*Math.sin(a)]});
let s=`<svg viewBox="0 0 520 300" class="msvg" role="img" aria-label="Account neighbourhood">`;nb.forEach((m,i)=>{s+=m[1]==='out'?edgeL(c,P[i],20,m[2]):edgeL(P[i],c,20,m[2])});s+=nodeG(c[0],c[1],n,{sel:1,r:24,attr:'data-act="noop"'});nb.forEach((m,i)=>s+=nodeG(P[i][0],P[i][1],m[0]));return s+'</svg>'}
function miniTxn(t){const nbr=n=>[...new Set(EDGES.filter(e=>(e[0]===n||e[1]===n)).map(e=>e[0]===n?e[1]:e[0]))].filter(x=>x!==t.s&&x!==t.r).slice(0,2);
const S0=[130,110],R0=[390,110],ns=nbr(t.s),nr=nbr(t.r),pS=[[40,36],[40,186]],pR=[[480,36],[480,186]];
let s=`<svg viewBox="0 0 520 225" class="msvg" role="img" aria-label="Sender, transaction, receiver">`;
ns.forEach((n,i)=>{const dir=EDGES.find(e=>e[0]===n&&e[1]===t.s);s+=dir?edgeL(pS[i],S0,18,1):edgeL(S0,pS[i],18,1)});
nr.forEach((n,i)=>{const dir=EDGES.find(e=>e[0]===n&&e[1]===t.r);s+=dir?edgeL(pR[i],R0,18,1):edgeL(R0,pR[i],18,1)});
s+=edgeL(S0,R0,22,1,true)+`<g transform="translate(260 110) rotate(45)"><rect x="-9" y="-9" width="18" height="18" fill="#2563EB" rx="3"/></g><text x="260" y="88" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="600">#${t.id}</text><text x="260" y="140" text-anchor="middle" font-size="11" fill="var(--mu)">${inr(t.paid)}</text>`;
ns.forEach((n,i)=>s+=nodeG(pS[i][0],pS[i][1],n,{r:16}));nr.forEach((n,i)=>s+=nodeG(pR[i][0],pR[i][1],n,{r:16}));
return s+nodeG(S0[0],S0[1],t.s,{sel:1,r:22})+nodeG(R0[0],R0[1],t.r,{r:22})+'</svg>'}
function curve(pts,color,w,h,dash){const p=34;return `<polyline fill="none" stroke="${color}" stroke-width="2.2" ${dash?'stroke-dasharray="5 4"':''} points="${pts.map(q=>`${p+q[0]*(w-p-10)},${h-26-q[1]*(h-40)}`).join(' ')}"/>`}
function chartFrame(w,h,body,xl,yl){let g='';for(let i=0;i<=4;i++){const x=34+i*(w-44)/4,y=h-26-i*(h-40)/4;g+=`<line x1="34" x2="${w-10}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="28" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mu)">${(i/4).toFixed(1)}</text><text x="${x}" y="${h-10}" text-anchor="middle" font-size="10" fill="var(--mu)">${(i/4).toFixed(1)}</text>`}return `<svg viewBox="0 0 ${w} ${h}" class="msvg" role="img">${g}${body}<text x="${w/2}" y="${h-0}" text-anchor="middle" font-size="10" fill="var(--mu)">${xl}</text><text x="8" y="12" font-size="10" fill="var(--mu)">${yl}</text></svg>`}

({alerts:drawAlerts,graph:()=>{drawGraph(true)}})[S.page]?.();if(scroll)window.scrollTo(0,0)}

function trow(t){const l=LV(t.score);return `<tr class="click" data-go="txn:${t.id}"><td class="mono">#${t.id}</td><td class="mono">${ACC[t.s].id}…</td><td class="mono">${ACC[t.r].id}…</td><td class="r-al">${inr(t.paid)}</td><td class="r-al">${t.score.toFixed(2)}</td><td>${badge(l)}</td><td><span class="b n">${t.status}</span></td></tr>`}

/* Plain-language reasons for a transaction */
function txnReasons(t){const l=LV(t.score),seen=t.fd<t.day,h=+t.ts.slice(-5,-3),I=l==='High'?['High','High','Medium','High','Medium']:l==='Medium'?['Medium','Low','Medium','Medium','Low']:['Low','Low','Low','Medium','Low'];
const base=[['The amount is unusually large',t.paid>100000?'High':t.paid>10000?'Medium':'Low'],['Paid by '+t.fmt+', a method often used to hide money',['Cash','Bitcoin','Wire'].includes(t.fmt)?'Medium':'Low'],['Paid and received in different currencies',t.cp!==t.cr?'Medium':'Low'],['Made at an unusual time of day',h<6?'Medium':'Low']];
if(!M2())return base;
return [base[0],[seen?'These two accounts have sent money to each other before':'First time these two accounts have dealt with each other',seen?'Low':I[0]],['Money has also moved the other way between them',I[1]],['The receiver is a busy hub that many accounts send to',I[2]],['Both accounts belong to a very large group of linked accounts',I[3]],['The account is behaving differently from its past activity',I[4]]]}

function filtered(){let L=TX.filter(t=>{const l=LV(t.score);return(!A.risk||l===A.risk)&&(!A.fmt||t.fmt===A.fmt)&&(!A.model||t.model===A.model)&&(!A.status||t.status===A.status)&&(!A.date||(({tr:[2,6],va:[7,8],te:[9,10],ta:[11,18]})[A.date][0]<=t.day&&t.day<=({tr:[2,6],va:[7,8],te:[9,10],ta:[11,18]})[A.date][1]))&&(!A.q||('#'+t.id+ACC[t.s].id+ACC[t.r].id).toLowerCase().includes(A.q.toLowerCase().replace('#','')))});
const k=A.sort;L.sort((a,b)=>{const x=k==='amt'?a.paid:k==='id'?a.id:k==='day'?a.day:a.score,y=k==='amt'?b.paid:k==='id'?b.id:k==='day'?b.day:b.score;return(x-y)*A.dir});return L}

$('#acounts')&&($('#acounts').innerHTML=[['Total alerts',L.length,''],['High risk',cnt('High'),'r'],['Medium risk',cnt('Medium'),'o'],['Low risk',cnt('Low'),'g']].map(c=>`<div class="card kpi"><div class="l">${c[0]}${c[2]?badge({r:'High',o:'Medium',g:'Low'}[c[2]]):''}</div><div class="v">${c[1]}</div></div>`).join(''));

if(!L.length){el.innerHTML=`<div class="empty">${ic('search',34)}<h4>No alerts match these filters</h4><div>Try a wider date range or reset the filters.</div><button class="btn" style="margin-top:12px" data-act="areset">Reset filters</button></div>`;return}
const th=(k,l,r)=>`<th class="so ${r?'r-al':''}" data-sort="${k}">${l}${A.sort===k?(A.dir<0?' ↓':' ↑'):''}</th>`,pg=L.slice((A.page-1)*10,A.page*10);
el.innerHTML=`<div class="sc"><table><thead><tr>${th('id','Transaction ID')}${th('day','Timestamp')}<th>Sender</th><th>Receiver</th>${th('amt','Amount',1)}${th('score','Risk score',1)}<th>Risk level</th><th>Status</th><th>Action</th></tr></thead><tbody>${pg.map(t=>`<tr class="click" data-go="txn:${t.id}"><td class="mono">#${t.id}</td><td>${t.ts}</td><td class="mono">${ACC[t.s].id}…</td><td class="mono">${ACC[t.r].id}…</td><td class="r-al">${inr(t.paid)}</td><td class="r-al">${t.score.toFixed(2)}</td><td>${badge(LV(t.score))}</td><td><span class="b n">${t.status}</span></td><td><button class="btn s" data-go="txn:${t.id}">View</button>${M2()?` <button class="btn s p" data-go="graph:${t.s}">Investigate</button>`:''}</td></tr>`).join('')}</tbody></table></div><div class="pg"><span>${(A.page-1)*10+1}–${Math.min(A.page*10,L.length)} of ${L.length}</span><button class="btn" data-pg="${A.page-1}">‹</button>${Array.from({length:pages},(_,i)=>`<button class="btn ${i+1===A.page?'on':''}" data-pg="${i+1}">${i+1}</button>`).join('')}<button class="btn" data-pg="${A.page+1}">›</button></div>`}}

function txnPage(){const t=TX.find(x=>x.id===S.txn),sb=`<div class="ctl"><input type="text" id="txq" placeholder="Search transaction ID, e.g. 1048211" style="min-width:280px" value="${t?'#'+t.id:''}"><button class="btn p" data-act="txsearch">${ic('search',14)} Search</button></div>`;

<div class="card"><h3>What mattered most<span class="tag">DEMO</span></h3>${hbars(F.map(f=>[f[0],f[1]*t.score*100]),'#2563EB',v=>v.toFixed(0))}<div class="sm mu" style="margin-top:8px">Placeholder for SHAP values from the backend.</div></div></div>
${M2()?`<div class="card"><h3>Graph context<button class="btn s" style="margin-left:auto" data-go="graph:${t.s}">Explore full graph ${ic('right',13)}</button></h3>${miniTxn(t)}</div>`:`<div class="banner">${ic('info',16)}<span>Model M1 looks at the transaction only. Switch to M2 in the top bar to also see account history and the transaction network.</span></div>`}`}

function accPage(){const a=ACC[S.acc],L=a.risk;
const prof=`<div class="card"><h3>Account profile</h3><dl class="kv"><dt>Bank</dt><dd>${a.bank}</dd><dt>Account</dt><dd>${a.id}…</dd><dt>Risk level</dt><dd>${badge(L)}</dd><dt>Transaction count</dt><dd>${fmtN(a.txns)}</dd>${M2()?`<dt>Node ID</dt><dd>${a.n}</dd><dt>Unique incoming</dt><dd>${a.uin}</dd><dt>Unique outgoing</dt><dd>${a.uout}</dd>`:''}</dl>${M2()?`<button class="btn p" style="margin-top:12px" data-go="graph:${a.n}">${ic('net',14)} Open in graph</button>`:''}</div>`;
const search=`<div class="ctl"><input type="text" id="acq" placeholder="Search account or node ID, e.g. 8000E1 or 3" style="min-width:280px"><button class="btn p" data-act="accsearch">${ic('search',14)} Search</button></div>`;
if(!M2())return search+`<div class="banner">${ic('info',16)}<span>Model M1 uses transaction features only, so the account network and graph details are hidden. Switch to M2 to see them.</span></div><div class="grid c1">${prof}</div>`;
return search+`<div class="grid c21"><div class="card"><h3>Account network<span class="tag">DEMO</span></h3>${ego(a.n)}<div class="lg"><span style="--c:${RC.High}">High risk</span><span style="--c:${RC.Medium}">Medium risk</span><span style="--c:${RC.Low}">Low risk</span></div><div class="sm mu" style="margin-top:6px">Click another account to inspect it.</div></div>
<div style="display:flex;flex-direction:column;gap:14px">${prof}
<div class="card"><h3>Historical behavior<span class="tag">DEMO</span></h3><dl class="kv"><dt>First observed</dt><dd>${a.first}</dd><dt>Last observed</dt><dd>${a.last}</dd><dt>Unique counterparties</dt><dd>${a.uin+a.uout}</dd><dt>Known account pairs</dt><dd>${EDGES.filter(e=>e[0]===a.n||e[1]===a.n).length}</dd></dl></div>
<div class="card"><h3>Network summary<span class="tag">DEMO</span></h3><div class="kv2"><div><small>Importance in network</small><b>${a.pr}</b></div><div><small>Linked group size</small><b>${a.wcc}</b></div><div><small>Sends to</small><b>${a.uout} accounts</b></div><div><small>Receives from</small><b>${a.uin} accounts</b></div><div><small>Has sent before</small><b>${a.sent}</b></div><div><small>Has received before</small><b>${a.recv}</b></div></div></div></div></div>`}

/* Plain-language explanation for a graph node */
function explain(n){const a=ACC[n],r=[],pr=+a.pr,wcc=+String(a.wcc).replace(/,/g,''),E=EDGES.filter(e=>e[2]<G.snap);
const hi=[...new Set(E.filter(e=>e[0]===n||e[1]===n).map(e=>e[0]===n?e[1]:e[0]))].filter(m=>ACC[m].risk==='High');
if(a.uin>=8)r.push(`It received money from ${a.uin} different accounts. Ordinary accounts usually have far fewer senders.`);
if(a.uout>=8)r.push(`It sent money on to ${a.uout} different accounts, which can mean it is passing funds along.`);
if(a.uin>=4&&a.uout>=4)r.push('It both receives from and sends to many accounts, which is typical of a pass-through account.');
if(E.some(e=>e[0]===n&&E.some(f=>f[0]===e[1]&&f[1]===n)))r.push('Money has gone back and forth between it and another account, which can be a sign of circular transfers.');
if(pr>=.006)r.push('It sits at the centre of many money flows, so lots of other accounts depend on it to move funds.');
if(wcc>=4000)r.push(`It is linked, directly or indirectly, to a very large group of about ${fmtN(wcc)} accounts, which makes the money trail hard to follow.`);
if(hi.length)r.push(`It is directly connected to ${hi.length} high-risk account${hi.length>1?'s':''} (${hi.map(m=>ACC[m].id).join(', ')}).`);
if(a.risk==='Low')return{head:'Not flagged. Nothing unusual found.',items:r.length?r.slice(0,2):['Its activity looks like that of a normal account: few counterparties and no unusual links.']};
if(r.length<2)r.push('Its overall activity pattern is close to patterns the model learned from known suspicious accounts.');
return{head:a.risk==='High'?'Flagged as high risk because:':'Flagged for a closer look because:',items:r.slice(0,4)}}

function graphPage(){return `<div class="card ctl" style="margin-bottom:12px"><input type="text" id="gq" placeholder="Search account, e.g. 80233B" style="min-width:220px"><button class="btn" data-act="gsearch">${ic('search',14)} Find</button><span class="mu sm">Depth</span><div class="seg" id="gdepth">${[1,2,3].map(d=>`<button data-gd="${d}" class="${G.depth===d?'on':''}">${d}</button>`).join('')}</div><span class="mu sm">Snapshot date</span><select id="gsnap">${Array.from({length:16},(_,i)=>`<option value="${i+3}" ${G.snap===i+3?'selected':''}>Sep ${i+3}</option>`).join('')}</select><button class="btn" data-act="greset">${ic('reset',14)} Reset</button><button class="btn" data-act="gfit">${ic('fit',14)} Fit graph</button><button class="btn" data-act="gcenter">${ic('target',14)} Center selected</button></div>
<div class="banner" id="gban">${ic('info',16)}<span></span></div>
<div class="grid c21"><div class="card gw"><svg id="gsvg" viewBox="0 0 900 520" role="img" aria-label="Interactive transaction network (demo)"><g id="gview"></g></svg><div class="gtools"><button class="btn" data-act="gzin" aria-label="Zoom in">${ic('plus',14)}</button><button class="btn" data-act="gzout" aria-label="Zoom out">${ic('minus',14)}</button></div><div style="padding:10px 14px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div class="lg" style="margin:0"><span style="--c:${RC.High}">High risk</span><span style="--c:${RC.Medium}">Medium risk</span><span style="--c:${RC.Low}">Low risk</span><span style="--c:#2563EB">Selected</span></div><span class="sm mu" id="gstat"></span></div></div><div class="card" id="gpanel"></div></div>`}
function visEdges(){return EDGES.filter(e=>e[2]<G.snap)}
function drawGraph(attach){const E=visEdges(),dep={[G.center]:0},q=[G.center];while(q.length){const n=q.shift();E.forEach(e=>{const m=e[0]===n?e[1]:e[1]===n?e[0]:null;if(m!==null&&dep[m]===undefined&&dep[n]<G.depth){dep[m]=dep[n]+1;q.push(m)}})}
const ok=n=>dep[n]!==undefined,VE=E.filter(e=>ok(e[0])&&ok(e[1])),nodes=Object.keys(dep).map(Number);
if(!ok(G.sel))G.sel=G.center;
let s='';VE.forEach(e=>{s+=edgeL(POS[e[0]],POS[e[1]],20,e[3],e[0]===G.sel||e[1]===G.sel)});nodes.forEach(n=>s+=nodeG(POS[n][0],POS[n][1],n,{sel:n===G.sel,r:n===G.center?24:20,attr:`data-act="gsel:${n}"`}));
$('#gview').innerHTML=s;$('#gview').setAttribute('transform',`translate(${G.x} ${G.y}) scale(${G.k})`);
$('#gban span').innerHTML=`<b>Click any account to see why it is flagged.</b> Only transactions before Sep ${G.snap} are shown, so no future information is used.`;
$('#gstat').textContent=`${nodes.length} accounts · ${VE.length} links · demo data`;
const a=ACC[G.sel],ex=explain(G.sel),pr=EDGES.find(e=>e[0]===G.center&&e[1]===G.sel&&e[2]<G.snap),rv=EDGES.find(e=>e[0]===G.sel&&e[1]===G.center&&e[2]<G.snap);
$('#gpanel').innerHTML=`<h3>Account ${a.id}…<span class="tag">DEMO</span></h3><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">${badge(a.risk)}<span class="mu sm">Bank ${a.bank}</span></div>
<div class="why ${a.risk}"><b>${ex.head}</b><ul>${ex.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>
<div class="sm mu" style="margin:8px 0 16px">A flag is a reason to look closer, not proof of wrongdoing.</div>
<h3>Quick facts</h3><dl class="kv"><dt>Receives from</dt><dd>${a.uin} accounts</dd><dt>Sends to</dt><dd>${a.uout} accounts</dd><dt>Linked group size</dt><dd>${a.wcc} accounts</dd><dt>Has sent money before</dt><dd>${a.sent}</dd><dt>Has received money before</dt><dd>${a.recv}</dd></dl>
${G.sel===G.center?'':`<h3 style="margin-top:16px">Link with the centre account</h3><dl class="kv"><dt>Sent money to it before</dt><dd>${pr?'Yes (×'+pr[3]+')':'No'}</dd><dt>Received money from it before</dt><dd>${rv?'Yes (×'+rv[3]+')':'No'}</dd></dl>`}
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn p" data-go="account:${a.n}">Investigate account ${ic('right',13)}</button>${G.sel!==G.center?`<button class="btn" data-act="gexpand">Expand from here</button>`:''}</div>`;
$$('#gdepth button').forEach(b=>b.classList.toggle('on',+b.dataset.gd===G.depth));
if(attach)attachGraph();return nodes}
function setView(){$('#gview').setAttribute('transform',`translate(${G.x} ${G.y}) scale(${G.k})`)}
function fitG(){const pts=$$('#gview .gn').map(g=>g.getAttribute('transform').match(/-?[\d.]+/g).map(Number));if(!pts.length)return;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),w=Math.max(...xs)-Math.min(...xs)+160,h=Math.max(...ys)-Math.min(...ys)+140,k=Math.min(2,900/w,520/h);G.k=k;G.x=450-k*(Math.max(...xs)+Math.min(...xs))/2;G.y=260-k*(Math.max(...ys)+Math.min(...ys))/2;setView()}
function attachGraph(){const svg=$('#gsvg');let drag=null;
svg.onpointerdown=e=>{if(e.target.closest('.gn'))return;drag={x:e.clientX,y:e.clientY,gx:G.x,gy:G.y};svg.setPointerCapture(e.pointerId);svg.style.cursor='grabbing'};
svg.onpointermove=e=>{if(!drag)return;const f=900/svg.clientWidth;G.x=drag.gx+(e.clientX-drag.x)*f;G.y=drag.gy+(e.clientY-drag.y)*f;setView()};
svg.onpointerup=()=>{drag=null;svg.style.cursor='grab'};
svg.onwheel=e=>{e.preventDefault();const f=e.deltaY<0?1.1:.9;G.k=Math.min(3,Math.max(.4,G.k*f));setView()}}

function modelsPage(){const M=['PR-AUC','Precision','Recall','F1','ROC-AUC'],pr1=[[0,.95],[.1,.82],[.2,.70],[.3,.58],[.4,.48],[.5,.40],[.6,.32],[.7,.25],[.8,.18],[.9,.12],[1,.05]],pr2=[[0,.96],[.1,.85],[.2,.72],[.3,.62],[.4,.50],[.5,.43],[.6,.33],[.7,.27],[.8,.19],[.9,.12],[1,.05]],ro1=[[0,0],[.02,.35],[.05,.55],[.1,.70],[.2,.82],[.4,.92],[.7,.97],[1,1]],ro2=[[0,0],[.02,.37],[.05,.55],[.1,.72],[.2,.83],[.4,.92],[.7,.97],[1,1]];
const leg='<div class="lg"><span style="--c:#94A3B8">M1</span><span style="--c:#2563EB">M2</span></div>';
const FI=[['Past dealings between accounts',.19],['How connected the account is',.15],['Size of linked group',.09],['Transaction amount',.16],['Payment method',.12],['Account history',.08]];
return `<div class="banner w">${ic('info',16)}<span>All metrics and curves are pending. Shapes below are illustrative placeholders, not results.</span></div>
<div class="grid c2"><div class="card"><h3>M1 <span class="b n">Transaction-only XGBoost</span></h3><div class="sm mu">Uses transaction features only.</div></div><div class="card" style="border-color:var(--blue)"><h3>M2 <span class="b bl">Transaction + Account History + Graph</span></h3><div class="sm mu">Adds historical account and graph features (date &lt; D).</div></div></div>
<div class="card" style="margin-bottom:14px"><h3>Metric comparison</h3><div class="sc"><table><thead><tr><th>Metric</th><th>M1</th><th>M2</th><th>Improvement</th></tr></thead><tbody>${M.map(m=>`<tr><td><b>${m}</b>${m==='PR-AUC'?' <span class="b bl">primary</span>':''}</td><td><span class="b n">Pending</span></td><td><span class="b n">Pending</span></td><td class="mu">—</td></tr>`).join('')}</tbody></table></div></div>
<div class="grid c2"><div class="card"><h3>PR curve<span class="tag">DEMO VISUALIZATION</span></h3>${chartFrame(420,260,curve(pr1,'#94A3B8',420,260)+curve(pr2,'#2563EB',420,260,1),'Recall','Precision')}${leg}</div><div class="card"><h3>ROC curve<span class="tag">DEMO VISUALIZATION</span></h3>${chartFrame(420,260,`<line x1="34" y1="234" x2="410" y2="20" stroke="var(--grid)" stroke-dasharray="4 4"/>`+curve(ro1,'#94A3B8',420,260)+curve(ro2,'#2563EB',420,260,1),'False positive rate','True positive rate')}${leg}</div></div>
<div class="grid c2"><div class="card"><h3>Confusion matrix<span class="tag">DEMO VALUES</span></h3><div class="cm"><div></div><div class="h">Predicted normal</div><div class="h">Predicted suspicious</div><div class="h">Actual normal</div><div class="c"><small>True negative</small><b>—</b></div><div class="c"><small>False positive</small><b>—</b></div><div class="h">Actual laundering</div><div class="c"><small>False negative</small><b>—</b></div><div class="c"><small>True positive</small><b>—</b></div></div><div class="sm mu" style="margin-top:10px">Cells fill in once the validation-chosen threshold is applied to test data.</div></div>
<div class="card"><h3>What the model relies on<span class="tag">DEMO</span></h3>${hbars(FI.map(f=>[f[0],f[1]*100]),'#2563EB',v=>v.toFixed(0)+'%')}</div></div>
<div class="card" style="border:2px solid var(--blue)"><h3>Does graph information improve detection?</h3><div class="mu">Final conclusion will be populated after M1/M2 evaluation.</div></div>`}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]'),g=e.target.closest('[data-go]');
if(a){const [k,v]=a.dataset.act.split(':');
if(k==='back')return back();
if(k==='areset'){Object.assign(A,{risk:'',date:'',fmt:'',model:'',status:'',q:'',page:1,mode:'ok'});return render()}
if(k==='amode'){A.mode=v;return drawAlerts()}
if(k==='txsearch'){const q=$('#txq').value.replace('#','').trim();const t=TX.find(x=>String(x.id)===q);if(t){S.txn=t.id;S.txnErr=false}else S.txnErr=true;return render()}
if(k==='accsearch'){const q=$('#acq').value.trim().toLowerCase(),i=ACC.findIndex(x=>x.id.toLowerCase().startsWith(q)||String(x.n)===q);if(i<0)return toast('No account found');S.acc=i;return render()}
if(k==='gsel'){G.sel=+v;return drawGraph()}
if(k==='gsearch'){const q=$('#gq').value.trim().toLowerCase(),i=ACC.findIndex(x=>x.id.toLowerCase().startsWith(q));if(i<0||!q)return toast('No account found');G.center=i;G.sel=i;drawGraph();return fitG()}
if(k==='greset'){Object.assign(G,{center:0,sel:0,depth:2,snap:10,x:0,y:0,k:1});render();return}
if(k==='gfit')return fitG();
if(k==='gcenter'){const p=POS[G.sel];G.x=450-G.k*p[0];G.y=260-G.k*p[1];return setView()}
if(k==='gzin'){G.k=Math.min(3,G.k*1.2);return setView()}if(k==='gzout'){G.k=Math.max(.4,G.k/1.2);return setView()}
if(k==='gexpand'){G.center=G.sel;drawGraph();return fitG()}
return}
const gd=e.target.closest('[data-gd]');if(gd){G.depth=+gd.dataset.gd;return drawGraph()}
const so=e.target.closest('[data-sort]');if(so){const k=so.dataset.sort;A.dir=A.sort===k?-A.dir:-1;A.sort=k;return drawAlerts()}
const pg=e.target.closest('[data-pg]');if(pg){A.page=Math.max(1,+pg.dataset.pg);return drawAlerts()}
if(g){e.preventDefault();const [p,v]=g.dataset.go.split(':');go(p,v)}});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(f){A[f]=e.target.value;A.page=1;drawAlerts(true)}if(e.target.id==='gsnap'){G.snap=+e.target.value;drawGraph()}if(e.target.id==='selMd'){S.model=e.target.value;render(true)}});
let aqT;document.addEventListener('input',e=>{if(e.target.id==='aq'){clearTimeout(aqT);aqT=setTimeout(()=>{A.q=e.target.value;A.page=1;drawAlerts()},200)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const id=e.target.id;if(id==='txq')$('[data-act="txsearch"]').click();if(id==='acq')$('[data-act="accsearch"]').click();if(id==='gq')$('[data-act="gsearch"]').click()}});
$('#logo').innerHTML=ic('shield',22);$('#burger').innerHTML=ic('menu');
$('#burger').onclick=()=>$('#app').classList.toggle('min');
render();
</script>
</body>
</html>
