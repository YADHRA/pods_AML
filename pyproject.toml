[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aml"
version = "0.1.0"
description = "Graph-based AML detection: transaction vs. historical account/network features"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas>=2.0", "pyarrow", "pyyaml", "scikit-learn",
  "xgboost", "shap", "networkx", "scipy",
  "fastapi", "uvicorn", "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
